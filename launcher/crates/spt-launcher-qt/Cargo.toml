[package]
name = "spt-launcher-qt"
description = "SPT launcher & installer front end (QML via cxx-qt)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
spt-core = { path = "../spt-core" }
cxx = "1.0.176"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_gui", "qt_qml"] }
serde_json = "1"
anyhow = "1"

[build-dependencies]
cxx-qt-build = "0.10"
