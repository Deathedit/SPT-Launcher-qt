[package]
name = "spt-core"
description = "SPT launcher core: server protocol, game patching, bundles, umu launch (no Qt)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1"
crc32fast = "1"
libc = "0.2"
ureq = { version = "3", default-features = false, features = ["rustls", "gzip"] }
